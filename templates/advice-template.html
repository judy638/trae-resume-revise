<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>求职策略建议书</title>
  <style>
    :root {
      --color-primary: #1a1a1a;
      --color-secondary: #4a4a4a;
      --color-accent: #2563eb;
      --color-accent-light: #eff6ff;
      --color-success: #059669;
      --color-warning: #d97706;
      --color-danger: #dc2626;
      --color-bg: #f1f5f9;
      --color-card: #ffffff;
      --color-border: #e2e8f0;
      --font-cn: "PingFang SC", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
      --font-en: "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-cn), var(--font-en);
      font-size: 14px;
      line-height: 1.65;
      color: var(--color-primary);
      background: var(--color-bg);
      min-height: 100vh;
    }

    /* ===== 顶部 Header ===== */
    .advice-header {
      background: linear-gradient(135deg, var(--color-accent), #1e40af);
      color: white;
      padding: 28px 32px 20px 32px;
    }
    .advice-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .advice-header .subtitle { font-size: 13px; opacity: 0.85; }
    .advice-header .job-info {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; opacity: 0.9;
    }

    /* ===== Tab 导航栏 ===== */
    .tab-nav {
      display: flex; overflow-x: auto; background: var(--color-card);
      border-bottom: 2px solid var(--color-border);
      position: sticky; top: 0; z-index: 100;
      padding: 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 14px 16px; font-size: 13px; font-weight: 500;
      color: var(--color-secondary); background: none; border: none;
      border-bottom: 3px solid transparent; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { color: var(--color-accent); background: var(--color-accent-light); }
    .tab-btn.active {
      color: var(--color-accent); font-weight: 700;
      border-bottom-color: var(--color-accent);
    }
    .tab-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      font-size: 11px; font-weight: 700; background: #e2e8f0; color: var(--color-secondary);
      transition: all 0.2s;
    }
    .tab-btn.active .tab-num { background: var(--color-accent); color: white; }

    /* ===== 内容区 ===== */
    .content-area {
      max-width: 900px; margin: 0 auto; padding: 24px 20px 40px;
    }
    .tab-panel { display: none; animation: fadeIn 0.3s ease; }
    .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== 通用卡片 ===== */
    .section {
      background: var(--color-card); border-radius: 10px; padding: 22px 24px;
      margin-bottom: 18px; border: 1px solid var(--color-border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .section:last-child { margin-bottom: 0; }
    .section h2 {
      font-size: 17px; font-weight: 700; color: var(--color-primary);
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 2px solid var(--color-accent); display: flex; align-items: center; gap: 8px;
    }
    .section h2 .dot { color: var(--color-accent); font-size: 14px; }
    .section h3 {
      font-size: 14.5px; font-weight: 600; color: var(--color-primary);
      margin: 14px 0 8px;
    }
    .section h3:first-child { margin-top: 0; }
    .section h4 {
      font-size: 13.5px; font-weight: 600; color: var(--color-secondary);
      margin: 10px 0 6px;
    }

    /* ===== 匹配度 ===== */
    .match-overview {
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    }
    .match-score {
      text-align: center; min-width: 120px;
    }
    .match-score .score-number {
      font-size: 44px; font-weight: 700; color: var(--color-accent); line-height: 1;
    }
    .match-score .score-label { font-size: 12px; color: var(--color-secondary); margin-top: 4px; }
    .score-level {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; margin-top: 8px;
    }
    .score-level.high { background: #dcfce7; color: #166534; }
    .score-level.medium { background: #fef3c7; color: #92400e; }
    .match-details { flex: 1; min-width: 250px; }
    .match-item { margin-bottom: 10px; }
    .match-item-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
    .match-item-label .name { font-weight: 500; }
    .match-item-label .score { color: var(--color-accent); font-weight: 600; }
    .match-bar { height: 7px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .match-bar-fill { height: 100%; background: var(--color-accent); border-radius: 4px; transition: width 0.5s; }

    .match-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .match-list { grid-template-columns: 1fr; } }
    .match-card { padding: 14px; border-radius: 8px; border: 1px solid var(--color-border); }
    .match-card.matched { border-color: #bbf7d0; background: #f0fdf4; }
    .match-card.gap { border-color: #fecaca; background: #fef2f2; }
    .match-card h4 { font-size: 13.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .match-card.matched h4 { color: #166534; }
    .match-card.gap h4 { color: #991b1b; }
    .match-card ul { list-style: none; padding: 0; }
    .match-card li { font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
    .match-card li:last-child { border-bottom: none; }
    .match-card li .skill { font-weight: 500; }
    .match-card li .evidence { color: var(--color-secondary); font-size: 11.5px; margin-top: 1px; }

    /* ===== 改写对比 ===== */
    .rewrite-item {
      border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; margin-bottom: 10px;
    }
    .rewrite-row { display: flex; padding: 10px 14px; font-size: 12.5px; }
    .rewrite-row.before { background: #fef2f2; border-bottom: 1px dashed #fecaca; }
    .rewrite-row.after { background: #f0fdf4; }
    .rewrite-label { font-weight: 600; min-width: 55px; flex-shrink: 0; }
    .rewrite-row.before .rewrite-label { color: #991b1b; }
    .rewrite-row.after .rewrite-label { color: #166534; }
    .rewrite-content { flex: 1; }

    /* ===== 表格 ===== */
    table {
      width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0;
    }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--color-border); }
    th { background: #f8fafc; font-weight: 600; font-size: 12px; color: var(--color-secondary); }
    tr:hover td { background: #f8fafc; }

    /* ===== 信息卡片 ===== */
    .info-card {
      background: var(--color-accent-light); border-radius: 8px; padding: 16px;
      border: 1px solid #bfdbfe; margin-bottom: 14px;
    }
    .info-card .info-row {
      display: flex; flex-wrap: wrap; gap: 12px 24px; font-size: 13px;
    }
    .info-card .info-item { display: flex; gap: 4px; }
    .info-card .info-label { color: var(--color-secondary); }
    .info-card .info-value { font-weight: 600; }
    .info-card .highlight {
      background: #fef3c7; padding: 2px 8px; border-radius: 4px;
      font-weight: 700; font-size: 14px; color: #92400e;
    }

    /* ===== 风险列表 ===== */
    .risk-list { list-style: none; padding: 0; }
    .risk-item {
      padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 12.5px;
      display: flex; gap: 10px;
    }
    .risk-item.high { background: #fef2f2; border: 1px solid #fecaca; }
    .risk-item.medium { background: #fffbeb; border: 1px solid #fde68a; }
    .risk-icon { font-size: 15px; flex-shrink: 0; }
    .risk-text strong { display: block; margin-bottom: 2px; }

    /* ===== 行动列表 ===== */
    .action-list { list-style: none; padding: 0; counter-reset: action; }
    .action-item {
      position: relative; padding: 12px 14px 12px 44px; margin-bottom: 8px;
      background: var(--color-accent-light); border-radius: 8px; font-size: 12.5px;
      counter-increment: action;
    }
    .action-item::before {
      content: counter(action); position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); width: 22px; height: 22px;
      background: var(--color-accent); color: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
    }
    .action-item strong { display: block; margin-bottom: 3px; color: var(--color-primary); }

    /* ===== 链接按钮 ===== */
    .link-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
      text-decoration: none; transition: all 0.2s; margin: 3px 4px 3px 0;
    }
    .link-btn.primary { background: var(--color-accent); color: white; }
    .link-btn.primary:hover { background: #1d4ed8; }
    .link-btn.outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
    .link-btn.outline:hover { background: var(--color-accent-light); }
    .link-btn.map { background: #059669; color: white; }
    .link-btn.map:hover { background: #047857; }
    .link-btn.search { background: #dc2626; color: white; }
    .link-btn.search:hover { background: #b91c1c; }

    /* ===== Tag 标签 ===== */
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11.5px;
      margin-right: 5px; margin-bottom: 4px;
    }
    .tag-green { background: #d1fae5; color: var(--color-success); }
    .tag-yellow { background: #fef3c7; color: var(--color-warning); }
    .tag-red { background: #fee2e2; color: var(--color-danger); }
    .tag-blue { background: #dbeafe; color: var(--color-accent); }

    .highlight-box {
      background: #eff6ff; border-left: 4px solid var(--color-accent);
      padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 12.5px;
    }

    /* ===== Footer ===== */
    .advice-footer {
      text-align: center; padding: 20px; font-size: 11.5px; color: #94a3b8;
    }

    ul { padding-left: 18px; font-size: 12.5px; margin-bottom: 10px; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <!-- 头部 -->
  <div class="advice-header">
    <h1>求职策略建议书</h1>
    <p class="subtitle">资深 HR 视角 · 价值导向 · 助力你的下一份理想工作</p>
    <div class="job-info">
      <!-- {{JOB_INFO}} -->
    </div>
  </div>

  <!-- Tab 导航 -->
  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="panel-match">
      <span class="tab-num">01</span> 岗位匹配度
    </button>
    <button class="tab-btn" data-tab="panel-resume">
      <span class="tab-num">02</span> 简历调整
    </button>
    <button class="tab-btn" data-tab="panel-company">
      <span class="tab-num">03</span> 公司调研
    </button>
    <button class="tab-btn" data-tab="panel-product">
      <span class="tab-num">04</span> 产品口碑
    </button>
    <button class="tab-btn" data-tab="panel-interview">
      <span class="tab-num">05</span> 面试准备
    </button>
    <button class="tab-btn" data-tab="panel-salary">
      <span class="tab-num">06</span> 薪资谈判
    </button>
    <button class="tab-btn" data-tab="panel-risk">
      <span class="tab-num">07</span> 风险提示
    </button>
    <button class="tab-btn" data-tab="panel-action">
      <span class="tab-num">08</span> 行动建议
    </button>
  </nav>

  <!-- 内容区 -->
  <div class="content-area">

    <!-- 01 岗位匹配度 -->
    <div class="tab-panel active" id="panel-match">
      <!-- {{MATCH_SECTION}} -->
    </div>

    <!-- 02 简历调整 -->
    <div class="tab-panel" id="panel-resume">
      <!-- {{RESUME_SECTION}} -->
    </div>

    <!-- 03 公司调研 -->
    <div class="tab-panel" id="panel-company">
      <!-- {{COMPANY_SECTION}} -->
    </div>

    <!-- 04 产品口碑 -->
    <div class="tab-panel" id="panel-product">
      <!-- {{PRODUCT_SECTION}} -->
    </div>

    <!-- 05 面试准备 -->
    <div class="tab-panel" id="panel-interview">
      <!-- {{INTERVIEW_SECTION}} -->
    </div>

    <!-- 06 薪资谈判 -->
    <div class="tab-panel" id="panel-salary">
      <!-- {{SALARY_SECTION}} -->
    </div>

    <!-- 07 风险提示 -->
    <div class="tab-panel" id="panel-risk">
      <!-- {{RISK_SECTION}} -->
    </div>

    <!-- 08 行动建议 -->
    <div class="tab-panel" id="panel-action">
      <!-- {{ACTION_SECTION}} -->
    </div>

  </div>

  <div class="advice-footer">
    本建议书由简历精修技能自动生成，仅供参考。祝你求职顺利，拿到心仪的 offer！
  </div>

  <script>
    (function() {
      var nav = document.getElementById('tabNav');
      var tabs = nav.querySelectorAll('.tab-btn');
      var panels = document.querySelectorAll('.tab-panel');

      tabs.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var targetId = this.getAttribute('data-tab');
          // 切换按钮状态
          tabs.forEach(function(t) { t.classList.remove('active'); });
          this.classList.add('active');
          // 切换面板
          panels.forEach(function(p) { p.classList.remove('active'); });
          document.getElementById(targetId).classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
